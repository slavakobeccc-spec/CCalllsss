<script>
// Хранилище данных
let users = JSON.parse(localStorage.getItem('callapp_users')) || {};
let currentUser = null;
let onlineUsers = new Set();

// Загрузка при старте
window.onload = function() {
    // Проверяем сохранённого пользователя
    const savedUser = localStorage.getItem('callapp_currentUser');
    if (savedUser && users[savedUser]) {
        loginUser(savedUser);
    }
};

// ================ ФУНКЦИИ АВТОРИЗАЦИИ ================

function register() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    
    if (!username || !password) {
        showMessage('Заполните все поля', 'error');
        return;
    }
    
    if (users[username]) {
        showMessage('Имя пользователя занято', 'error');
        return;
    }
    
    users[username] = {
        password: password,
        friends: [],
        calls: []
    };
    
    localStorage.setItem('callapp_users', JSON.stringify(users));
    loginUser(username);
    showMessage('Регистрация успешна!', 'success');
}

function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    
    if (!username || !password) {
        showMessage('Заполните все поля', 'error');
        return;
    }
    
    const user = users[username];
    
    if (!user || user.password !== password) {
        showMessage('Неверные данные', 'error');
        return;
    }
    
    loginUser(username);
    showMessage('Вход выполнен!', 'success');
}

function loginUser(username) {
    currentUser = username;
    onlineUsers.add(username);
    localStorage.setItem('callapp_currentUser', username);
    
    document.getElementById('auth-screen').classList.remove('active');
    document.getElementById('main-screen').classList.add('active');
    document.getElementById('current-user').textContent = username;
    
    loadFriends();
}

// ================ ФУНКЦИИ ДЛЯ ДРУЗЕЙ ================

function addFriend() {
    const friendName = document.getElementById('friend-name').value.trim();
    
    if (!friendName) {
        showMessage('Введите имя пользователя', 'error');
        return;
    }
    
    if (friendName === currentUser) {
        showMessage('Нельзя добавить себя', 'error');
        return;
    }
    
    if (!users[friendName]) {
        showMessage('Пользователь не найден', 'error');
        return;
    }
    
    const user = users[currentUser];
    
    if (user.friends.includes(friendName)) {
        showMessage('Уже в друзьях', 'error');
        return;
    }
    
    user.friends.push(friendName);
    localStorage.setItem('callapp_users', JSON.stringify(users));
    loadFriends();
    
    document.getElementById('friend-name').value = '';
    showMessage(`Друг ${friendName} добавлен!`, 'success');
}

function loadFriends() {
    if (!currentUser || !users[currentUser]) return;
    
    const user = users[currentUser];
    const friendsList = document.getElementById('friends-list');
    
    if (!user.friends || user.friends.length === 0) {
        friendsList.innerHTML = '<p style="text-align: center; color: gray; padding: 20px;">Нет друзей</p>';
        return;
    }
    
    friendsList.innerHTML = user.friends.map(friend => `
        <div class="friend-item" style="
            background: #f8f9fa; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        ">
            <div>
                <strong>${friend}</strong>
                <span style="color: green; font-size: 12px; margin-left: 10px;">● онлайн</span>
            </div>
            <div>
                <button onclick="makeCallTo('${friend}')" style="
                    background: #28a745; 
                    color: white; 
                    border: none; 
                    padding: 5px 10px; 
                    border-radius: 5px; 
                    margin-right: 5px;
                    cursor: pointer;
                ">📞</button>
                <button onclick="removeFriend('${friend}')" style="
                    background: #dc3545; 
                    color: white; 
                    border: none; 
                    padding: 5px 10px; 
                    border-radius: 5px;
                    cursor: pointer;
                ">🗑️</button>
            </div>
        </div>
    `).join('');
}

function removeFriend(friendName) {
    if (confirm(`Удалить ${friendName} из друзей?`)) {
        const user = users[currentUser];
        user.friends = user.friends.filter(f => f !== friendName);
        localStorage.setItem('callapp_users', JSON.stringify(users));
        loadFriends();
        showMessage('Друг удален', 'success');
    }
}

// ================ ФУНКЦИИ ЗВОНКОВ ================

function makeCall() {
    const toUser = document.getElementById('call-to').value.trim();
    if (toUser) {
        makeCallTo(toUser);
    } else {
        showMessage('Введите имя пользователя', 'error');
    }
}

function makeCallTo(friendName) {
    if (!users[friendName]) {
        showMessage('Пользователь не найден', 'error');
        return;
    }
    
    showMessage(`Звонок ${friendName}... (имитация)`, 'success');
    // В будущем здесь будет реальный звонок через WebRTC
}

function makeVideoCall() {
    const toUser = document.getElementById('call-to').value.trim();
    if (toUser) {
        showMessage(`Видеозвонок ${toUser}... (имитация)`, 'success');
    } else {
        showMessage('Введите имя пользователя', 'error');
    }
}

// ================ ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ================

function showTab(tabName) {
    // Скрываем все вкладки
    document.getElementById('friends-tab').style.display = 'none';
    document.getElementById('calls-tab').style.display = 'none';
    
    // Показываем нужную вкладку
    document.getElementById(tabName + '-tab').style.display = 'block';
    
    // Обновляем активные табы
    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
    });
    event.target.classList.add('active');
}

function logout() {
    if (confirm('Выйти из аккаунта?')) {
        currentUser = null;
        localStorage.removeItem('callapp_currentUser');
        document.getElementById('main-screen').classList.remove('active');
        document.getElementById('auth-screen').classList.add('active');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }
}

function showMessage(text, type) {
    const messageDiv = document.getElementById('auth-message');
    if (!messageDiv) return;
    
    messageDiv.textContent = text;
    messageDiv.className = 'message ' + type;
    messageDiv.style.cssText = `
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        text-align: center;
        background: ${type === 'error' ? '#f8d7da' : '#d4edda'};
        color: ${type === 'error' ? '#721c24' : '#155724'};
    `;
    
    setTimeout(() => {
        messageDiv.textContent = '';
    }, 3000);
}
</script>
